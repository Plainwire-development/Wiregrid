services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wiregrid
      POSTGRES_PASSWORD: wiregrid
      POSTGRES_DB: wiregrid
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiregrid"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  scylla:
    image: scylladb/scylla:6.2
    command: ["--smp", "1", "--memory", "750M", "--overprovisioned", "1"]
    ports: ["9042:9042"]
